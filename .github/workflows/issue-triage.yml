name: Mark new issues for triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      # Intake only: maintainer review determines type, priority, size and readiness.
      - name: Require issue triage
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Create the repository-local intake label once if this mirror has none.
          if ! gh api "repos/$GITHUB_REPOSITORY/labels/status%3A%20needs%20triage" >/dev/null 2>&1; then
            gh label create 'status: needs triage' --repo "$GITHUB_REPOSITORY" --color '5319e7' --description 'New issue awaiting maintainer triage' || true
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'status: needs triage'
